<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="16" y1="14" x2="112" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9055ff"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <!-- Clay Inner Bevel Highlight -->
    <linearGradient id="clayHighlight" x1="64" y1="12" x2="64" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Base Cover Gradient -->
    <linearGradient id="bookCoverGrad" x1="24" y1="84" x2="104" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Pages Gradient Left -->
    <linearGradient id="pageGradLeft" x1="28" y1="64" x2="64" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdfcff"/>
      <stop offset="70%" stop-color="#f3eefa"/>
      <stop offset="100%" stop-color="#e0d5f5"/>
    </linearGradient>

    <!-- Pages Gradient Right -->
    <linearGradient id="pageGradRight" x1="100" y1="64" x2="64" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdfcff"/>
      <stop offset="70%" stop-color="#f3eefa"/>
      <stop offset="100%" stop-color="#e0d5f5"/>
    </linearGradient>

    <!-- Center Blossom Petal Gradient -->
    <linearGradient id="centerPetalGrad" x1="64" y1="28" x2="64" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Left Wing Petal Gradient -->
    <linearGradient id="leftPetalGrad" x1="42" y1="36" x2="64" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="60%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <!-- Right Wing Petal Gradient -->
    <linearGradient id="rightPetalGrad" x1="86" y1="36" x2="64" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Star Glow / Sparkle Gradient -->
    <linearGradient id="starGrad" x1="64" y1="14" x2="64" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Clay Drop Shadows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#2e0b57" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e043a" flood-opacity="0.2"/>
    </filter>

    <filter id="flowerGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4c0519" flood-opacity="0.28"/>
    </filter>

    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3" flood-color="#240747" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Main Clay Squircle Badge -->
  <rect x="12" y="12" width="104" height="104" rx="30" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>
  <rect x="13.5" y="13.5" width="101" height="101" rx="28.5" fill="none" stroke="url(#clayHighlight)" stroke-width="2.5"/>

  <!-- Soft 3D Ambient Clay Light in Bottom Corner -->
  <ellipse cx="64" cy="110" rx="36" ry="6" fill="#431407" opacity="0.18"/>

  <!-- ==================== BLOOMING FLOWER ("HOA") ==================== -->
  <g filter="url(#flowerGlow)">
    <!-- Left Blooming Petal / Leaf -->
    <path d="M 64 68 C 58 64 42 54 39 42 C 37 34 43 31 49 35 C 57 41 62 55 64 68 Z" fill="url(#leftPetalGrad)"/>
    <!-- Left Petal Highlight -->
    <path d="M 44 37 C 47 34 52 38 56 45 C 53 43 48 39 44 37 Z" fill="#ffffff" opacity="0.45"/>

    <!-- Right Blooming Petal / Leaf -->
    <path d="M 64 68 C 70 64 86 54 89 42 C 91 34 85 31 79 35 C 71 41 66 55 64 68 Z" fill="url(#rightPetalGrad)"/>
    <!-- Right Petal Highlight -->
    <path d="M 84 37 C 81 34 76 38 72 45 C 75 43 80 39 84 37 Z" fill="#ffffff" opacity="0.38"/>

    <!-- Center Blooming Petal / Lotus Bud -->
    <path d="M 64 70 C 58 60 54 48 58 35 C 60 28 64 24 64 24 C 64 24 68 28 70 35 C 74 48 70 60 64 70 Z" fill="url(#centerPetalGrad)"/>
    <!-- Center Petal 3D Sheen -->
    <path d="M 64 27 C 64 27 61 34 61 44 C 61 52 63 60 64 65 C 63 60 62 52 63 43 C 63 35 64 27 64 27 Z" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- ==================== OPEN BOOK ("LEARNING") ==================== -->
  <g filter="url(#bookShadow)">
    <!-- Book Outer Cover Backing -->
    <path d="M 27 82 C 40 85 54 88 64 94 C 74 88 88 85 101 82 C 103 84.5 102 88.5 100 90 C 88 93.5 74 96.5 64 101 C 54 96.5 40 93.5 28 90 C 26 88.5 25 84.5 27 82 Z" fill="url(#bookCoverGrad)"/>

    <!-- Book Spine Ribbon / Center Accent -->
    <path d="M 62.5 73 L 65.5 73 L 65.5 95 L 62.5 95 Z" fill="#2e0854"/>

    <!-- Left Page Block (Thickness Underneath) -->
    <path d="M 28 79 C 39 81 52 83 63 87 L 63 89 C 52 85 39 83 28 81 Z" fill="#c4b5fd"/>
    <!-- Right Page Block (Thickness Underneath) -->
    <path d="M 100 79 C 89 81 76 83 65 87 L 65 89 C 76 85 89 83 100 81 Z" fill="#c4b5fd"/>

    <!-- Left Top Page -->
    <path d="M 63.5 72 C 51 68 37 66 27 68 C 25.5 68.3 25 69.5 25 71 L 25 78 C 25 79.5 26 80.2 27.5 80 C 37.5 78 51 80 63.5 85 Z" fill="url(#pageGradLeft)"/>
    <!-- Left Page Subtle Text Lines -->
    <path d="M 33 72.5 C 40 72 49 73.5 56 76" stroke="#9d8bb8" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 33 75.5 C 39 75 46 76.2 52 78.5" stroke="#9d8bb8" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>

    <!-- Right Top Page -->
    <path d="M 64.5 72 C 77 68 91 66 101 68 C 102.5 68.3 103 69.5 103 71 L 103 78 C 103 79.5 102 80.2 100.5 80 C 90.5 78 77 80 64.5 85 Z" fill="url(#pageGradRight)"/>
    <!-- Right Page Subtle Text Lines -->
    <path d="M 72 76 C 79 73.5 88 72 95 72.5" stroke="#9d8bb8" stroke-width="1.3" stroke-linecap="round" opacity="0.6"/>
    <path d="M 76 78.5 C 82 76.2 89 75 95 75.5" stroke="#9d8bb8" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>

    <!-- Book Center Fold / Spine Creep -->
    <path d="M 63.2 72 Q 64 78 63.5 85.5 L 64.5 85.5 Q 64.8 78 64.8 72 Z" fill="#704bb8" opacity="0.7"/>
  </g>

  <!-- ==================== INSPIRATION SPARKLE / STAR ==================== -->
  <g>
    <!-- Soft Ambient Sparkle Glow Behind -->
    <circle cx="64" cy="22" r="8" fill="#fde047" opacity="0.32"/>
    <circle cx="64" cy="22" r="3.5" fill="#ffffff" opacity="0.75"/>

    <!-- 4-Pointed Star of Wisdom -->
    <path d="M 64 14 Q 64 22 72 22 Q 64 22 64 30 Q 64 22 56 22 Q 64 22 64 14 Z" fill="url(#starGrad)"/>

    <!-- Secondary Mini Sparkle (Top Right) -->
    <path d="M 88 23 Q 88 27 92 27 Q 88 27 88 31 Q 88 27 84 27 Q 88 27 88 23 Z" fill="#fef08a" opacity="0.85"/>
  </g>
</svg>
